<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>系统设置</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f5f7;color:#1d1d1f;margin:0}header{background:#fff;padding:20px 6%}main{max-width:740px;margin:40px auto;background:white;padding:32px;border-radius:22px}input,button{box-sizing:border-box;width:100%;padding:13px;border:1px solid #ddd;border-radius:12px;margin:9px 0 18px}button{background:#007aff;color:white;border:0;cursor:pointer}a{color:#007aff}small{color:#666}</style></head><body><header>◈ Linux AI Diagnostic　<a href="/">诊断工作台</a>　<a href="/inventory">资产管理</a></header><main><h1>系统设置</h1><p>飞书应用配置已加密保存。敏感密钥不会从 API 回显。</p><label>飞书 App ID<input id="app_id" disabled></label><label>管理员 Open ID<input id="admin_open_id" disabled></label><label>公网 HTTPS 地址<input id="public_url" disabled></label><label>更新飞书 App Secret<input id="app_secret" type="password" autocomplete="new-password" placeholder="留空则保持原密钥"></label><button id="save">保存密钥</button><button id="logout" style="background:#8e8e93">退出登录</button><small id="status"></small></main><script>
async function load(){const r=await fetch('/api/settings');if(r.status===401){location.href='/login';return}const d=await r.json();for(const k of ['app_id','admin_open_id','public_url'])document.getElementById(k).value=d[k]||''}
document.getElementById('save').onclick=async()=>{const secret=document.getElementById('app_secret').value;if(!secret)return;const r=await fetch('/api/settings',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({app_secret:secret})});document.getElementById('status').textContent=r.ok?'已保存':'保存失败';document.getElementById('app_secret').value=''};
document.getElementById('logout').onclick=async()=>{await fetch('/api/logout',{method:'POST'});location.href='/login'};load();
</script></body></html>
