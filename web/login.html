<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>飞书登录 · Linux AI Diagnostic</title>
    <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg" />
    <link rel="stylesheet" href="/assets/style.css" />
    <script defer src="/assets/login.js"></script>
  </head>
  <body class="auth-body">
    <main class="auth-page">
      <section class="login-card">
        <div class="login-logo">L</div>
        <h1>Linux AI Diagnostic</h1>
        <p class="sub">Linux 只读诊断管理平台</p>
        <p class="sub">使用企业飞书身份登录</p>
        <a class="primary login-button" href="/auth/feishu"
          >使用飞书账号登录
          <svg class="icon" aria-hidden="true">
            <use href="/assets/icons.svg#arrow"></use></svg
        ></a>
        <div class="login-hint">
          管理员权限由 Web 中配置的飞书 Open ID 控制。<br />内网 HTTP 与 HTTPS
          使用相同的身份验证流程。
        </div>
        <p id="loginError" class="status error" role="alert" hidden></p>
        <p class="sub login-foot">专用 SSH 凭据 · 主机公钥核验 · 操作审计</p>
      </section>
    </main>
  </body>
</html>
