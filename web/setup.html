<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>首次初始化</title><style>body{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;background:#f5f5f7;margin:0;color:#1d1d1f}main{max-width:530px;margin:6vh auto;background:white;padding:35px;border-radius:24px;box-shadow:0 15px 50px #0001}input,button{box-sizing:border-box;width:100%;padding:13px;margin:8px 0 17px;border:1px solid #ddd;border-radius:12px}button{background:#007aff;color:white;border:0;cursor:pointer}small{color:#666}#message{color:#b54708;white-space:pre-wrap}</style></head><body><main><h1>◈ 系统初始化</h1><p>配置飞书管理员登录。初始化凭证仅能从服务器本地读取，不会显示在公网。</p><form id="form"><label>一次性初始化凭证<input name="bootstrap_token" type="password" required autocomplete="off"></label><label>飞书 App ID<input name="app_id" placeholder="cli_..." required></label><label>飞书 App Secret<input name="app_secret" type="password" required></label><label>管理员 Open ID<input name="admin_open_id" placeholder="ou_..." required></label><label>公网 HTTPS 地址<input name="public_url" type="url" placeholder="https://diag.example.com" required></label><button>完成初始化</button></form><small>飞书应用安全设置需添加回调地址：公网 HTTPS 地址 + /auth/feishu/callback</small><p id="message"></p></main><script>document.getElementById('form').onsubmit=async e=>{e.preventDefault();const data=Object.fromEntries(new FormData(e.target));const res=await fetch('/setup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(data)});const d=await res.json();document.getElementById('message').textContent=res.ok?'初始化完成。飞书回调地址：'+d.redirect_uri:d.detail||'初始化失败';if(res.ok)setTimeout(()=>location.href='/login',1800)}</script></body></html>
