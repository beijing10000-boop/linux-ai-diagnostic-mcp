<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资产管理 · Linux AI Diagnostic</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI",sans-serif;color:#1d1d1f;background:#f5f5f7}
body{margin:0}header{background:#fff;padding:20px 5%;border-bottom:1px solid #ddd}main{max-width:1160px;margin:28px auto;padding:0 18px}
a{color:#007aff;text-decoration:none}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:20px}
section{background:#fff;border-radius:20px;padding:24px;box-shadow:0 6px 20px #00000008}input,select,button{padding:11px;border:1px solid #ddd;border-radius:10px;box-sizing:border-box;margin:5px 0;width:100%}
button{background:#007aff;color:white;cursor:pointer;border:0}.danger{background:#ff3b30;width:auto;padding:7px 12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:10px 5px;text-align:left;border-bottom:1px solid #eee;overflow-wrap:anywhere}
small{color:#86868b}#message{min-height:20px;color:#b54708}
</style></head><body><header><b>◈ Linux AI Diagnostic</b>　<a href="/">诊断工作台</a>　 / 资产与代理</header><main><h1>主机组与代理管理</h1><p>集中管理主机组、服务器及代理分配。代理当前为登记状态，远程执行通道尚未启用。</p><section><label>API Token <input id="token" type="password" autocomplete="off" placeholder="输入本次会话 Token"></label><button id="refresh">刷新资产</button><p id="message"></p></section><div class="grid">
<section><h2>主机组</h2><form id="groupForm"><input name="name" placeholder="组名" required maxlength="80"><input name="description" placeholder="描述"><button>创建主机组</button></form><div id="groups"></div></section>
<section><h2>代理节点</h2><form id="proxyForm"><input name="name" placeholder="代理名称" required maxlength="80"><input name="description" placeholder="机房 / 网段"><button>登记代理</button></form><small>登记不等于已连接；当前代理不会接收 SSH 任务。</small><div id="proxies"></div></section>
<section><h2>Linux 主机</h2><form id="hostForm"><input name="name" placeholder="主机名" required><input name="address" placeholder="IPv4 / IPv6" required><input name="ssh_port" type="number" value="22" min="1" max="65535"><select name="group_id" id="groupSelect"><option value="">不分组</option></select><select name="proxy_id" id="proxySelect"><option value="">直连（仅登记）</option></select><button>添加主机</button></form><div id="hosts"></div></section>
</div></main><script>
const $=id=>document.getElementById(id);const api=async(path,options={})=>{const res=await fetch('/api/'+path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+$('token').value}});const data=await res.json();if(!res.ok)throw Error(data.detail||'HTTP '+res.status);return data};
function table(id,rows,cols,kind){const target=$(id);target.replaceChildren();const t=document.createElement('table'),head=t.insertRow();cols.forEach(k=>{const th=document.createElement('th');th.textContent=k;head.append(th)});const th=document.createElement('th');th.textContent='操作';head.append(th);rows.forEach(r=>{const tr=t.insertRow();cols.forEach(k=>{const td=tr.insertCell();td.textContent=String(r[k]??'—')});const td=tr.insertCell(),b=document.createElement('button');b.className='danger';b.textContent='删除';b.onclick=async()=>{if(!confirm('确定删除？'))return;try{await api(kind+'/'+r.id,{method:'DELETE'});await refresh()}catch(e){$('message').textContent=e.message}};td.append(b)});target.append(t)}
function options(id,rows,label){const sel=$(id);sel.replaceChildren();let empty=document.createElement('option');empty.value='';empty.textContent=label;sel.append(empty);rows.forEach(r=>{const o=document.createElement('option');o.value=r.id;o.textContent=r.name;sel.append(o)})}
async function refresh(){try{const [g,p,h]=await Promise.all(['groups','proxies','hosts'].map(x=>api(x)));table('groups',g,['name','description'],'groups');table('proxies',p,['name','status'],'proxies');table('hosts',h,['name','address','group_id','proxy_id'],'hosts');options('groupSelect',g,'不分组');options('proxySelect',p,'直连（仅登记）');$('message').textContent='资产已刷新'}catch(e){$('message').textContent=e.message}}
for(const [form,path] of [['groupForm','groups'],['proxyForm','proxies'],['hostForm','hosts']])$(form).onsubmit=async e=>{e.preventDefault();const f=new FormData(e.target),data=Object.fromEntries(f);if(path==='hosts'){data.ssh_port=Number(data.ssh_port);for(const k of ['group_id','proxy_id'])data[k]=data[k]?Number(data[k]):null}try{await api(path,{method:'POST',body:JSON.stringify(data)});e.target.reset();await refresh()}catch(err){$('message').textContent=err.message}};
$('refresh').onclick=refresh;
</script></body></html>
