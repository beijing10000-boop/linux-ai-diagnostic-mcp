<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>资产管理 · Linux AI Diagnostic</title><link rel="stylesheet" href="/assets/style.css"><script src="/assets/common.js" defer></script><script src="/assets/inventory.js" defer></script></head>
<body><header class="topbar"><div><a class="brand" href="/">◈ Linux AI Diagnostic <span data-version></span></a><nav class="nav"><a href="/">诊断工作台</a><a href="/inventory">资产与代理</a><a href="/settings">系统设置</a></nav></div></header>
<main class="container"><div class="headline"><div><div class="eyebrow">Infrastructure / 资产管理</div><h1>主机、主机组与代理</h1><p class="muted">统一维护服务器清单、主机公钥与组织结构</p></div><button id="refresh" class="secondary">刷新资产</button></div><p id="status" class="status"></p>
<div class="grid"><section class="card"><h2>新建主机组</h2><form id="groupForm"><label>名称<input name="name" required maxlength="80" placeholder="生产环境"></label><label>描述<input name="description" maxlength="500" placeholder="用于分类与资产管理"></label><button class="full">创建主机组</button></form><div id="groups"></div></section>
<section class="card"><h2>登记代理节点</h2><form id="proxyForm"><label>代理名称<input name="name" required maxlength="80" placeholder="机房 A 代理"></label><label>所属网络或说明<input name="description" maxlength="500" placeholder="仅用于资产登记"></label><button class="full">添加代理</button></form><p class="notice">v0.1.0 尚未启用分布式代理调度；关联代理的主机不能执行诊断。</p><div id="proxies"></div></section>
<section class="card"><h2>添加 Linux 主机</h2><form id="hostForm"><label>主机名称<input name="name" required maxlength="80" placeholder="web-01"></label><div class="form-cols"><div><label>内网 IP<input name="address" required placeholder="172.20.1.10"></label></div><div><label>SSH 端口<input name="ssh_port" type="number" min="1" max="65535" value="22" required></label></div></div><label>主机组<select name="group_id" id="groupSelect"><option value="">不分组</option></select></label><label>代理<select name="proxy_id" id="proxySelect"><option value="">直连</option></select></label><label>SSH 主机公钥（必须核对）<textarea name="host_key" required placeholder="ssh-ed25519 AAAAC3Nz..." rows="3"></textarea></label><small>必须从可信渠道核对完整公钥或指纹，不要直接信任未经核对的 ssh-keyscan 输出。</small><button class="full">添加主机</button></form></section>
<section class="card wide"><h2>主机清单</h2><div id="hosts"></div></section></div><p class="footnote">只允许添加 RFC1918 IPv4 或 IPv6 ULA 地址，禁止将 SSH 诊断指向公网目标。</p></main></body></html>
