<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Linux AI Diagnostic</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif;color-scheme:light dark}
body{margin:0;background:#f5f5f7;color:#1d1d1f}header{background:#fff;border-bottom:1px solid #e5e5ea;padding:22px 5%;font-size:22px;font-weight:700}
main{max-width:1100px;margin:36px auto;padding:0 20px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.card{background:white;border-radius:20px;padding:24px;box-shadow:0 5px 24px #00000009}h1{font-size:32px;letter-spacing:-.8px}
small{color:#86868b}label{display:block;margin:14px 0 6px}input,select,button{box-sizing:border-box;width:100%;border:1px solid #d2d2d7;border-radius:11px;padding:12px;font-size:15px}
button{background:#007aff;color:white;border:0;cursor:pointer;margin-top:18px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#151515;color:#d7f7df;padding:20px;border-radius:14px;min-height:120px}
@media(prefers-color-scheme:dark){body{background:#111114;color:#eee}header,.card{background:#1c1c1e;color:#eee}small{color:#aaa}}
</style></head><body><header>◈ Linux AI Diagnostic <small> / 管理控制台</small></header>
<main><h1>服务器诊断工作台</h1><p>SSH 强制命令 · 只读操作 · 主机白名单</p>
<div class="cards"><div class="card"><small>诊断类型</small><h2>7 种</h2></div><div class="card"><small>SSH 安全</small><h2>强制网关</h2></div><div class="card"><small>部署模式</small><h2>自建</h2></div></div>
<section class="card" style="margin-top:22px"><h2>执行诊断</h2><label>授权主机 IP</label><input id="host" placeholder="192.0.2.10"><p><a href="/inventory">主机与代理</a> · <a href="/settings">系统设置</a></p><label>诊断操作</label><select id="action"><option>cpu</option><option>memory</option><option>disk</option><option>network</option><option>sockets</option><option>processes</option><option>service</option></select><label>服务名（仅 service 操作需要）</label><input id="service" placeholder="nginx"><button id="run">开始只读诊断</button><h3>诊断结果</h3><pre id="output">等待诊断...</pre></section>
</main><script>
document.getElementById('run').addEventListener('click',async()=>{
const v=id=>document.getElementById(id).value;
document.getElementById('output').textContent='正在执行...';
try{const res=await fetch('/api/diagnose',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({host:v('host'),action:v('action'),service:v('action')==='service'?v('service'):null})});
const data=await res.json();document.getElementById('output').textContent=JSON.stringify(data,null,2)}
catch(e){document.getElementById('output').textContent='请求失败：'+e.message}
});
</script></body></html>
