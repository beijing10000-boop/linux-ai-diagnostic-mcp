name: CI

on:
  push:
    branches:
      - main
      - release/v0.1.0
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Compile
        run: python -m compileall -q app tests
      - name: Check critical lint rules
        run: ruff check . --select E4,E7,E9,F
      - name: Regression tests
        run: pytest -q

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: pip install -r requirements-dev.txt
      - run: npm ci
      - run: npm run check:web
      - run: npx playwright install --with-deps --only-shell chromium
      - name: Browser regression against isolated HTTPS fixture
        run: npm run test:ui
        env:
          DIAG_PYTHON: python
      - name: Browser regression against LAN HTTP fixture
        run: npm run test:ui
        env:
          DIAG_PYTHON: python
          DIAG_UI_PROTOCOL: http
          DIAG_UI_ARTIFACTS: ui-artifacts/http
      - name: Upload UI screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-console-screenshots
          path: ui-artifacts/
          retention-days: 7

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare persistent data ownership
        run: |
          mkdir -p data
          sudo chown 10001:10001 data
          sudo chmod 700 data
      - name: Verify Compose
        run: |
          docker compose config --quiet
          docker compose -f compose.lan.yaml config --quiet
      - name: Start development container
        run: docker compose up -d --build
      - name: Check port 9099 and one-time bootstrap
        run: |
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:9099/healthz >/tmp/health.json; then
              break
            fi
            sleep 2
          done
          python -c 'import json; from pathlib import Path; assert json.load(open("/tmp/health.json"))["version"] == Path("VERSION").read_text().strip()'
          docker compose exec -T web test -s /app/data/bootstrap.token
          test "$(docker compose port web 9099)" = "127.0.0.1:9099"
      - name: Docker logs on failure
        if: failure()
        run: docker compose logs --tail=200
      - name: Stop containers
        if: always()
        run: docker compose down
